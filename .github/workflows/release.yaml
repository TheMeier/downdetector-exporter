name: Release

on:
  push:
    tags:
      - '*'

permissions: {}

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 'Pull Code'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 'Build and Push Image'
        run: |
          IMAGE_NAMESPACE=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          docker build --pull \
            --build-arg VERSION=${GITHUB_REF_NAME} \
            --tag ghcr.io/${IMAGE_NAMESPACE}/downdetector-exporter:${GITHUB_REF_NAME} \
            --tag ghcr.io/${IMAGE_NAMESPACE}/downdetector-exporter:latest \
            .
          docker push ghcr.io/${IMAGE_NAMESPACE}/downdetector-exporter:${GITHUB_REF_NAME}
          docker push ghcr.io/${IMAGE_NAMESPACE}/downdetector-exporter:latest
  release:
    runs-on: ubuntu-latest
    needs: docker-build-push
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create Release Page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${GITHUB_REF_NAME} --generate-notes
